name: Public regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stdlib:
    name: Python checks (not KiCad integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q tools tests examples
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
